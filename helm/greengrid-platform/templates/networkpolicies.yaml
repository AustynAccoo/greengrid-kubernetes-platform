{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-default-deny
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-allow-dns
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "greengrid.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.namespaceLabel | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-generator-to-api
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greengrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telemetry-generator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "greengrid.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: telemetry-api
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-helm-test-to-api
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greengrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: helm-test
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "greengrid.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: telemetry-api
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-api-ingress
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greengrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telemetry-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "greengrid.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: telemetry-generator
        - podSelector:
            matchLabels:
              {{- include "greengrid.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: helm-test
      ports:
        - {protocol: TCP, port: 8000}
{{- if .Values.monitoring.managedPrometheus.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greengrid.fullname" . }}-managed-prometheus-to-api
  labels: {{- include "greengrid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greengrid.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telemetry-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.managedPrometheusCollector.namespaceLabel | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.managedPrometheusCollector.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8000}
{{- end }}
{{- end }}
