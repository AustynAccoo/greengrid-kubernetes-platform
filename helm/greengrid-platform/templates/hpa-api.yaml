{{- if .Values.telemetryApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "greengrid.apiName" . }}
  labels:
    {{- include "greengrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "greengrid.apiName" . }}}
  minReplicas: {{ .Values.telemetryApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.telemetryApi.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.telemetryApi.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
        - {type: Percent, value: {{ .Values.telemetryApi.autoscaling.behavior.scaleUp.percent }}, periodSeconds: {{ .Values.telemetryApi.autoscaling.behavior.scaleUp.periodSeconds }}}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.telemetryApi.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        - {type: Percent, value: {{ .Values.telemetryApi.autoscaling.behavior.scaleDown.percent }}, periodSeconds: {{ .Values.telemetryApi.autoscaling.behavior.scaleDown.periodSeconds }}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.telemetryApi.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}

